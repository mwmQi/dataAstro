[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataAstro"
version = "0.1.0"
description = "Vedic Astrology Engine & AstroSage-compatible Kundli extraction module"
readme = "README.md"
authors = [{ name = "mwmQi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyswisseph>=2.10.3.2",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0"
]

[project.scripts]
data-astro = "data_astro.__main__:main"
